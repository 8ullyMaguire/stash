type Fingerprint @requiresRole(role: "subscriber") {

  type: String!
  value: String!
}

type Folder @requiresRole(role: "subscriber") {

  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder
  "Returns all parent folders in order from immediate parent to top-level"
  parent_folders: [Folder!]!
  zip_file: BasicFile

  "Returns direct sub-folders"
  sub_folders: [Folder!]!

  mod_time: Time!

  created_at: Time!
  updated_at: Time!
}

interface BaseFile @requiresRole(role: "subscriber") {

  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  created_at: Time!
  updated_at: Time!
}

type BasicFile implements BaseFile @requiresRole(role: "subscriber") {

  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  created_at: Time!
  updated_at: Time!
}

type VideoFile implements BaseFile @requiresRole(role: "subscriber") {

  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  format: String!
  width: Int!
  height: Int!
  duration: Float!
  video_codec: String!
  audio_codec: String
  frame_rate: Float
  bit_rate: Int!
  """
  #4233 - the rotation sidecar in DEGREES, as ffprobe reports it. 0 means no rotation; a negative
  value is counter-clockwise. `width` and `height` remain the ENCODED dimensions and are correct as
  such (the transcode scale filter and sprite geometry both depend on that), so a client deciding
  orientation must account for this rather than comparing width against height directly. A 1920x1080
  video with rotation 90 displays as 1080x1920.
  """
  rotation: Int!

  """
  #3530 - the time THIS SCENE starts within this file, in seconds. null means the scene
  uses the whole file. Exposed on the FILE rather than on Scene because that is where it
  lives: there is no per-scene-file type in the runtime model, so one file backing two
  scenes carries two different windows and "the scene's window" is not a single fact.
  A scene with two files therefore shows two windows, which is the truth rather than a
  convenient fiction.
  """
  start_time: Float
  """
  #3530 - the time this scene ends within this file, in seconds. null means the window is
  open-ended: it runs to the end of the file. 0 is NOT the same as null and is not what
  this returns -- a zero-length window is refused by the database CHECK.
  """
  end_time: Float

  scenes: [Scene!]!

  created_at: Time!
  updated_at: Time!
}

type ImageFile implements BaseFile @requiresRole(role: "subscriber") {

  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  format: String!
  width: Int!
  height: Int!

  images: [Image!]!

  created_at: Time!
  updated_at: Time!
}

union VisualFile = VideoFile | ImageFile

type GalleryFile implements BaseFile @requiresRole(role: "subscriber") {

  id: ID!
  path: String!
  basename: String!

  parent_folder_id: ID! @deprecated(reason: "Use parent_folder instead")
  zip_file_id: ID @deprecated(reason: "Use zip_file instead")

  parent_folder: Folder!
  zip_file: BasicFile

  mod_time: Time!
  size: Int64!

  fingerprint(type: String!): String
  fingerprints: [Fingerprint!]!

  galleries: [Gallery!]!

  created_at: Time!
  updated_at: Time!
}

input MoveFilesInput {
  ids: [ID!]!
  "valid for single or multiple file ids"
  destination_folder: String

  "valid for single or multiple file ids"
  destination_folder_id: ID

  "valid only for single file id. If empty, existing basename is used"
  destination_basename: String
}

input SetFingerprintsInput {
  type: String!
  "a null value will remove the fingerprint"
  value: String
}

input FileSetFingerprintsInput {
  id: ID!
  "only supplied fingerprint types will be modified"
  fingerprints: [SetFingerprintsInput!]!
}

type FindFilesResultType @requiresRole(role: "subscriber") {

  count: Int!

  "Total megapixels of any image files"
  megapixels: Float!
  "Total duration in seconds of any video files"
  duration: Float!

  "Total file size in bytes"
  size: Int!

  files: [BaseFile!]!
}

type FindFoldersResultType @requiresRole(role: "subscriber") {

  count: Int!
  folders: [Folder!]!
}
