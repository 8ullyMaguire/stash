type PluginPaths @requiresRole(role: "subscriber") {

  # path to javascript files
  javascript: [String!]
  # path to css files
  css: [String!]
}

type Plugin @requiresRole(role: "subscriber") {

  id: ID!
  name: String!
  description: String
  url: String
  version: String

  enabled: Boolean!

  tasks: [PluginTask!]
  hooks: [PluginHook!]
  settings: [PluginSetting!]

  """
  Plugin IDs of plugins that this plugin depends on.
  Applies only for UI plugins to indicate css/javascript load order.
  """
  requires: [ID!]

  paths: PluginPaths!
}

type PluginTask @requiresRole(role: "subscriber") {

  name: String!
  description: String
  plugin: Plugin!
}

type PluginHook @requiresRole(role: "subscriber") {

  name: String!
  description: String
  hooks: [String!]
  plugin: Plugin!
}

type PluginResult @requiresRole(role: "subscriber") {

  error: String
  result: String
}

input PluginArgInput {
  key: String!
  value: PluginValueInput
}

input PluginValueInput {
  str: String
  i: Int
  b: Boolean
  f: Float
  o: [PluginArgInput!]
  a: [PluginValueInput!]
}

enum PluginSettingTypeEnum {
  STRING
  NUMBER
  BOOLEAN
}

type PluginSetting @requiresRole(role: "subscriber") {

  name: String!
  display_name: String
  description: String
  type: PluginSettingTypeEnum!
}
