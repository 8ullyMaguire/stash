enum GenderEnum {
  MALE
  FEMALE
  TRANSGENDER_MALE
  TRANSGENDER_FEMALE
  INTERSEX
  NON_BINARY
}

enum CircumcisedEnum {
  CUT
  UNCUT
}

type Performer @publicRead {

  id: ID!
  name: String!
  disambiguation: String
  url: String @deprecated(reason: "Use urls")
  urls: [String!]
  gender: GenderEnum
  twitter: String @deprecated(reason: "Use urls")
  instagram: String @deprecated(reason: "Use urls")
  birthdate: String
  ethnicity: String
  country: String
  eye_color: String
  height_cm: Int
  measurements: String
  fake_tits: String
  penis_length: Float
  circumcised: CircumcisedEnum
  career_length: String @deprecated(reason: "Use career_start and career_end")
  career_start: String
  career_end: String
  tattoos: String
  piercings: String
  "Structured tattoo locations, one per mark. The structured form of `tattoos`. stash#2359"
  tattoo_locations: [String!]!
  "Structured piercing locations, one per mark. The structured form of `piercings`. stash#2359"
  piercing_locations: [String!]!
  "All marks with their descriptions. stash#2359"
  body_marks: [BodyMark!]!
  "Nationalities. A performer may hold several. stash#2359, #1922"
  nationalities: [Nationality!]!
  alias_list: [String!]!
  favorite: Boolean!
  tags: [Tag!]!
  ignore_auto_tag: Boolean!

  image_path: String # Resolver
  scene_count: Int! # Resolver
  image_count: Int! # Resolver
  gallery_count: Int! # Resolver
  group_count: Int! # Resolver
  movie_count: Int! @deprecated(reason: "use group_count instead") # Resolver
  performer_count: Int! # Resolver
  o_counter: Int # Resolver
  scenes: [Scene!]!
  stash_ids: [StashID!]!
  # rating expressed as 1-100
  rating100: Int
  details: String
  death_date: String
  hair_color: String
  weight: Int
  created_at: Time!
  updated_at: Time!
  groups: [Group!]!
  movies: [Movie!]! @deprecated(reason: "use groups instead")

  custom_fields: Map!
}

input PerformerCreateInput {
  name: String!
  disambiguation: String
  url: String @deprecated(reason: "Use urls")
  urls: [String!]
  gender: GenderEnum
  birthdate: String
  ethnicity: String
  country: String
  eye_color: String
  height_cm: Int
  measurements: String
  fake_tits: String
  penis_length: Float
  circumcised: CircumcisedEnum
  career_length: String @deprecated(reason: "Use career_start and career_end")
  career_start: String
  career_end: String
  tattoos: String
  piercings: String
  "Structured tattoo locations. stash#2359"
  tattoo_locations: [String!]
  "Structured piercing locations. stash#2359"
  piercing_locations: [String!]
  "Nationality ids. A performer may hold several. stash#2359, #1922"
  nationality_ids: [ID!]
  "Duplicate aliases and those equal to name will be ignored (case-insensitive)"
  alias_list: [String!]
  twitter: String @deprecated(reason: "Use urls")
  instagram: String @deprecated(reason: "Use urls")
  favorite: Boolean
  tag_ids: [ID!]
  "This should be a URL or a base64 encoded data URL"
  image: String
  """
  Image IDs to link to this performer, REPLACING any existing set (an empty list clears it).

  This is the `performers_images` join, which is what `image_count` reads. It is NOT the
  `image` field above: that one writes a single blob column serving `image_path`, and the two
  are independent by design so no existing user's image is destroyed. stash#571.
  """
  images: [ID!]
  stash_ids: [StashIDInput!]
  # rating expressed as 1-100
  rating100: Int
  details: String
  death_date: String
  hair_color: String
  weight: Int
  ignore_auto_tag: Boolean

  custom_fields: Map
}

