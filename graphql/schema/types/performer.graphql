"""
A nationality a performer may hold. stash#2359, #1922.

A reference-table row rather than a string: `id` is what a filter matches on, `name` is what a
selector shows, and `code` is what an export writes. Two entries have a NULL `code` (Basque,
Kurdish), because Stash-Box carries nationalities that are not countries and a non-null code would
force a lie.
"""
type Nationality @publicRead {
  # @publicRead, not @requiresRole. Both new types hang off Performer, which is already @publicRead:
  # a nationality is a fixed 107-row reference list with no instance-specific data in it, and a
  # body mark is only reachable by traversing to its performer. Annotating them more strictly than
  # their only parent would make them unreachable, which is the opposite of the policy's purpose.
  # TestEveryFieldDeclaresItsAccessPolicy enforces that every field is annotated at all, so this is
  # a deliberate choice rather than an omission.
  id: ID!
  name: String!
  "ISO 3166-1 alpha-2, or null for a nationality that is not a country"
  code: String
}

"""
A tattoo or piercing. stash#2359.

`location` is what identifies it ("left arm"), `description` is optional detail. Both kinds live in
one table discriminated by `kind`, because a performer has both and an editor asks for both at once.
"""
type BodyMark @publicRead {
  id: ID!
  "Always one of `tattoo` or `piercing`"
  kind: String!
  location: String!
  description: String
}

input BodyMarkCreateInput {
  performer_id: ID!
  "One of `tattoo` or `piercing`"
  kind: String!
  location: String!
  description: String
}

input BodyMarkDestroyInput {
  id: ID!
}
