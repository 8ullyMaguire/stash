fragment FolderData on Folder {
  id
  basename
  path
}

fragment VideoFileData on VideoFile {
  id
  path
  size
  mod_time
  duration

  #3530 - the window this SCENE takes from this file. Present on VideoFile rather than
  # Scene because that is where it lives: one file can back several scenes with different
  # windows, so "the scene's window" is not a single fact. The panel reads these to show and
  # edit the range, and `duration` above is already the CLAMPED window length rather than the
  # file's own length, so the two are read together and never mixed up.
  start_time
  end_time

  video_codec
  audio_codec
  width
  height
  frame_rate
  bit_rate
  fingerprints {
    type
    value
  }
}

fragment ImageFileData on ImageFile {
  id
  path
  size
  mod_time
  width
  height
  fingerprints {
    type
    value
  }
}

fragment GalleryFileData on GalleryFile {
  id
  path
  size
  mod_time
  fingerprints {
    type
    value
  }
}

fragment VisualFileData on VisualFile {
  ... on BaseFile {
    id
    path
    size
    mod_time
    fingerprints {
      type
      value
    }
  }
  ... on ImageFile {
    id
    path
    size
    mod_time
    width
    height
    fingerprints {
      type
      value
    }
  }
  ... on VideoFile {
    id
    path
    size
    mod_time
    duration
    video_codec
    audio_codec
    width
    height
    frame_rate
    bit_rate
    fingerprints {
      type
      value
    }
  }
}

fragment SelectFolderData on Folder {
  id
  path
  basename
}

fragment RecursiveFolderData on Folder {
  ...SelectFolderData

  parent_folders {
    ...SelectFolderData
  }
}
